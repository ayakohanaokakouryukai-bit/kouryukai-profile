name = "kouryukai-profile"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "../web"
run_worker_first = ["/api/*", "/admin/*"]
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kouryukai-profile"
database_id = "REPLACE_AT_SETUP"
migrations_dir = "migrations"

[vars]
EXPIRES_AT = "2027-05-06T23:59:59+09:00"
APP_BASE_URL = "REPLACE_AT_SETUP"
GAS_MAIL_URL = "REPLACE_AT_SETUP"

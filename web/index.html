<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100人交流会 参加者プロフィール</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/register.js"></script>
</head>
<body>
  <div id="status-bar" class="status-bar" role="status" aria-live="polite" hidden></div>
  <main class="container">
    <h1>100人交流会 参加者プロフィール</h1>
    <div id="form-area">
      <p class="lead">お申し込み時のメールアドレスを入力してください。あなた専用のページのURLをお送りします。</p>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" aria-describedby="message">
        </div>
        <p id="message" class="field-error" role="alert" hidden></p>
        <button id="submit" type="submit" class="btn">URLを送る</button>
      </form>
    </div>
  </main>
</body>
</html>
